name: Nightly database backup

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC — low traffic, well clear of the Monday watchdog cron
  workflow_dispatch: {} # lets you trigger one manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — see README.md#backups"
            exit 1
          fi
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges | gzip > backup.sql.gz

      # Stored as a workflow artifact rather than a Supabase Storage bucket
      # on purpose — a backup that lives inside the same project it's
      # backing up doesn't protect against losing the project itself.
      # GitHub's own retention cap enforces the 30-day window for us.
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz
          retention-days: 30
